<div class="container-fluid" id="log-container">
  <div class="row">
    <div class="col">
      <h2>Welcome, {{userService.user.nombreUsuario}}</h2>
    </div>
  </div>
  <div class="row">
    <div class="col">
      <table class="table table-dark table-striped">
        <thead>
          <tr>
            <th>User Name</th>
            <th>Email</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of userList">
            <td>{{user.nombreUsuario}}</td>
            <td>{{user.email}}</td>
            <td>
              <button class="btn btn-sm btn-primary me-2" *ngIf="!(user.nombreUsuario==userService.user.nombreUsuario)">Edit</button>
              <button class="btn btn-sm btn-danger" *ngIf="!(user.nombreUsuario==userService.user.nombreUsuario)">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
