<nav class="navbar navbar-expand-lg bg-body-tertiary bg-dark" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Prueba HAS</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <form class="container-fluid justify-content-end d-flex">
        <button class="btn btn-outline-success me-2" type="button" data-bs-toggle="modal" data-bs-target="#loginModal" *ngIf="!isAuth">Login</button>
        <button class="btn btn-outline-success me-2" type="button" (click)="logOut()" *ngIf="isAuth">Log-out</button>
      </form>
    </div>
  </div>
</nav>

<div class="row" *ngIf="!isAuth">
  <div class="col-md-3"></div>
  <div class="col-md-6" style="margin-top: 2%;">
    <app-user-form [isEditMode]="false" [userId]="0" (submitEvent)="notificarCreado($event)"></app-user-form>
  </div>
  <div class="col-md-3"></div>
</div>

<!-- Modal -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel"></h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <app-log-in (loginEvent)="cerrarModalLogin($event)"></app-log-in>
      </div>
    </div>
  </div>
</div>
