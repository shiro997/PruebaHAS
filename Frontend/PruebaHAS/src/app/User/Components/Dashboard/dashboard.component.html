<div class="container-fluid">
  <div class="row">
    <div class="col">
      <h2>Welcome, {{userService.user.nombreUsuario}}</h2>
    </div>
  </div>
  <div class="row">
    <div class="col-lg-6">
      <table class="table table-dark table-striped">
        <thead>
          <tr>
            <th>User Name</th>
            <th>Email</th>
            <th>Actions
              <button class="btn btn-sm btn-success ms-2" (click)="enterCreateMode()">Create</button>
              <button class="btn btn-sm btn-info ms-2" style="color: white;" (click)="refreshUsers()">Refresh</button>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of userList">
            <td>{{user.nombreUsuario}}</td>
            <td>{{user.email}}</td>
            <td>
              <button class="btn btn-sm btn-primary me-2" *ngIf="!(user.nombreUsuario==userService.user.nombreUsuario)" (click)="enterEditMode(user.idUsuario)">Edit</button>
              <button class="btn btn-sm btn-danger" *ngIf="!(user.nombreUsuario==userService.user.nombreUsuario)" (click)="deleteUser(user.idUsuario)">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="col-lg-6">
      <app-user-form [isEditMode]="false" [userId]="0" (submitEvent)="refreshUsers()" *ngIf="isCreateMode"></app-user-form>
      <app-user-form [isEditMode]="isEditMode" [userId]="userIdToEdit" (submitEvent)="refreshUsers()" *ngIf="isEditMode"></app-user-form>
  </div>
</div>
