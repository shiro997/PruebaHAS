<div class="container-fluid" >
  <form [formGroup]="frmLogIn">
    <div class="card">
      <div class="card-container">
        
        <div class="card-body">
          <div class="card-title">
            <h3>Log in</h3>
          </div>
          <div class="row">
            <div class="col">
              <input type="email" id="mail" required autocomplete="off" class="form-control" placeholder="email" formControlName="Email" (change)="validateEmail()" (blur)="validateEmail()">
              <span class="error" *ngIf="(frmLogIn.get('Email')?.touched || frmLogIn.get('Email')?.dirty) && frmLogIn.get('Email')?.errors?.['required']" style="color:red;">The email is required!</span>
              <span class="error" *ngIf="(frmLogIn.get('Email')?.touched || frmLogIn.get('Email')?.dirty) && frmLogIn.get('Email')?.errors?.['email']" style="color:red;">The email is invalid!</span>
            </div>
          </div>  
          <div class="row" style="margin-top: 2%;">
            <div class="col">
              <input type="password" id="pass" class="form-control" required autocomplete="off" placeholder="password" formControlName="Password" (blur)="ValidatePassword()">
              <span class="error" *ngIf="(frmLogIn.get('Password')?.touched || frmLogIn.get('Password')?.dirty) && frmLogIn.get('Password')?.errors?.['required']" style="color:red;">The password is required!</span>
              <span class="error" *ngIf="(frmLogIn.get('Password')?.touched || frmLogIn.get('Password')?.dirty) && frmLogIn.get('Password')?.errors?.['minlength']" style="color:red;">The password must be at least 8 characters!</span>
              <span class="error" *ngIf="(frmLogIn.get('Password')?.touched || frmLogIn.get('Password')?.dirty) && frmLogIn.get('Password')?.errors?.['pattern']" style="color:red;">The password must contain at least one letter and one number!</span>
            </div>
          </div>
        </div>
        <div class="card-footer">
          <button class="btn btn-primary" (click)="login()">log in</button>
        </div>
      </div>
    </div>
    

  </form>
</div>
